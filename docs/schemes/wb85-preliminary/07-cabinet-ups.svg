<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="2500" height="2050" viewBox="0 0 2500 2050" role="img" aria-labelledby="title desc"><title id="title">Схема теплообменника — Отдельный ИБП · дверная зона · оценка запаса</title><desc id="desc">Предварительная функциональная схема на WB8.5. Не монтажная электросхема. Состав согласован 15.11.2026; электрическое согласование — рабочее допущение. Проверки перечислены в README.md.</desc><defs><marker id="arrow0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M 0 0 L 10 5 L 0 10 z" fill="#286A9B"/></marker><marker id="arrow1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M 0 0 L 10 5 L 0 10 z" fill="#277A69"/></marker><marker id="arrow2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M 0 0 L 10 5 L 0 10 z" fill="#A76B20"/></marker><marker id="arrow3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M 0 0 L 10 5 L 0 10 z" fill="#18354A"/></marker></defs><rect width="100%" height="100%" fill="white"/><rect id="cabinet-ups-banner" x="60" y="162" width="2380" height="46" rx="6" fill="#FFF7E9" stroke="none" stroke-width="1.6"/><rect id="ups-shell" x="240" y="450" width="600" height="800" rx="6" fill="#E7EDF1" stroke="#18354A" stroke-width="1.6"/><rect id="ups-plate" x="290" y="500" width="500" height="700" rx="6" fill="#FFFFFF" stroke="#CCD8E0" stroke-width="1.6"/><rect id="ups-duct" x="310" y="820" width="460" height="40" rx="6" fill="#D5DEE4" stroke="#CCD8E0" stroke-width="1.6"/><polyline id="ups-width" points="240,1300 840,1300" fill="none" stroke="#18354A" stroke-width="1.5" stroke-linejoin="round" marker-start="url(#arrow3)" marker-end="url(#arrow3)"/><polyline id="cabinet-ups-rule" points="60,1955 2440,1955" fill="none" stroke="#CCD8E0" stroke-width="1" stroke-linejoin="round"/><text x="60" y="44" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#286A9B" text-anchor="start">ТЕПЛООБМЕННИК  /  АВТОМАТИЗАЦИЯ</text><text x="60" y="103" font-family="Arial, sans-serif" font-size="38" font-weight="700" fill="#18354A" text-anchor="start">Отдельный ИБП · дверная зона · оценка запаса</text><text x="60" y="136" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#526879" text-anchor="start">Архивный эскиз ред.03: ИБП ≥30 мин — новый кандидат корпуса 1200 × 800 × 400 мм; см. CABINET_SPECIFICATION.md.</text><text x="78" y="192" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#A76B20" text-anchor="start">ПРЕДВАРИТЕЛЬНАЯ ФУНКЦИОНАЛЬНАЯ СХЕМА  •  НЕ ДЛЯ МОНТАЖА  •  15.11.2026  •  Лист 7/7</text><rect id="ups-head" x="60" y="250" width="1100" height="150" rx="10" fill="#FFF7E9" stroke="#A76B20" stroke-width="1.6"/><text x="78" y="297" font-family="Arial, sans-serif" font-size="29" font-weight="700" fill="#18354A" text-anchor="start">Корпус ИБП · ориентир 800 × 600 × 400 мм*</text><text x="78" y="336" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#526879" text-anchor="start">Размеры В × Ш × Г. Это условный объём для подбора,</text><text x="78" y="370" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#526879" text-anchor="start">вместимость конкретного ИБП и аккумуляторов не подтверждена.</text><rect id="ups-device" x="340" y="550" width="400" height="240" rx="10" fill="#FFF7E9" stroke="#A76B20" stroke-width="1.6" stroke-dasharray="8 6"/><text x="358" y="593" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#18354A" text-anchor="start">ИБП — модель не выбрана</text><text x="358" y="630" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#526879" text-anchor="start">Условная зона</text><text x="358" y="660" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#526879" text-anchor="start">400 × 240 × 250 мм*</text><text x="358" y="690" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#526879" text-anchor="start">По D-146: ≥600 Вт и ≥600 ВА.</text><text x="358" y="720" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#526879" text-anchor="start">Это требование мощности,</text><text x="358" y="750" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#526879" text-anchor="start">а не расчёт автономности.</text><text x="540" y="851" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#18354A" text-anchor="middle">Трассы / вводы / защита — уточнить</text><rect id="ups-battery" x="340" y="900" width="400" height="200" rx="10" fill="#FFF7E9" stroke="#A76B20" stroke-width="1.6" stroke-dasharray="8 6"/><text x="358" y="942" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#18354A" text-anchor="start">Аккумуляторы и полка</text><text x="358" y="978" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#526879" text-anchor="start">Условная зона 400 × 200 × 250 мм*</text><text x="358" y="1008" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#526879" text-anchor="start">Тип, число, ёмкость, масса</text><text x="358" y="1038" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#526879" text-anchor="start">и крепление не подтверждены.</text><text x="300" y="1158" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#526879" text-anchor="start">Свободное место не подтверждает охлаждение.</text><text x="300" y="1185" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#526879" text-anchor="start">Проверить вентиляцию и допустимую нагрузку полки.</text><rect x="350" y="1264" width="380" height="26" fill="#FFFFFF"/><text x="540" y="1287" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#18354A" text-anchor="middle">600 мм*</text><rect id="power-boundary" x="60" y="1380" width="1100" height="220" rx="10" fill="#EDF5FB" stroke="#286A9B" stroke-width="1.6"/><text x="78" y="1425" font-family="Arial, sans-serif" font-size="27" font-weight="700" fill="#18354A" text-anchor="start">Питание сохраняет разделение D-146</text><text x="78" y="1463" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#526879" text-anchor="start">Вход ИБП: источник / цепь защиты уточняются по силовой схеме.</text><text x="78" y="1496" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#526879" text-anchor="start">Выход ИБП → управление / измерения АСУ и привод ШТ.</text><text x="78" y="1529" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#526879" text-anchor="start">Сеть / ДГУ → силовые потребители, включая ПЧ и насосы.</text><text x="78" y="1562" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#526879" text-anchor="start">АВР / ДГУ не добавлены внутрь щита как выбранное оборудование.</text><rect id="ups-fallback" x="60" y="1640" width="1100" height="230" rx="10" fill="#FFF7E9" stroke="#A76B20" stroke-width="1.6"/><text x="78" y="1685" font-family="Arial, sans-serif" font-size="27" font-weight="700" fill="#18354A" text-anchor="start">Если выбранное оборудование не входит</text><text x="78" y="1723" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#526879" text-anchor="start">Предварительный расширенный сценарий: 1000 × 600 × 500 мм*.</text><text x="78" y="1756" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#526879" text-anchor="start">Выбор возможен только после проверки модели, АКБ и автономности.</text><text x="78" y="1789" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#526879" text-anchor="start">Внешний корпус ИБП не резервирует силовые насосы / ПЧ.</text><text x="78" y="1822" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#526879" text-anchor="start">Новые сигналы состояния ИБП и интерфейсы не назначены.</text><rect id="door" x="1240" y="250" width="1200" height="300" rx="10" fill="#FFF7E9" stroke="#A76B20" stroke-width="1.6"/><text x="1258" y="296" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#18354A" text-anchor="start">Дверь основного щита · условные посадочные зоны</text><text x="1258" y="334" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#526879" text-anchor="start">Местный веб-HMI: устройство отображения ещё не выбрано.</text><text x="1258" y="368" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#526879" text-anchor="start">Для панели на двери условно оставить 350 × 250 × 80 мм*.</text><text x="1258" y="402" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#526879" text-anchor="start">Это опция размещения, не утверждение обязательной панели.</text><text x="1258" y="436" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#526879" text-anchor="start">Кнопка «Авария», свет и звук: условная общая зона 250 × 100 мм*.</text><text x="1258" y="470" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#526879" text-anchor="start">Модели, глубины, отверстия и аппаратная схема — проверить.</text><text x="1258" y="504" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#526879" text-anchor="start">Зоны на двери располагать вне проекции глубокого ПЧ и его проводов.</text><rect id="depth" x="1240" y="590" width="1200" height="265" rx="10" fill="#EDF5FB" stroke="#286A9B" stroke-width="1.6"/><text x="1258" y="636" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#18354A" text-anchor="start">Почему предложена глубина 400 мм</text><text x="1258" y="674" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#526879" text-anchor="start">ПЧ: 194 мм; с ЛПО1 — ещё 7,6 мм по документации.</text><text x="1258" y="708" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#526879" text-anchor="start">Для оценки принято: 50 мм от задней стенки до плиты</text><text x="1258" y="742" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#526879" text-anchor="start">+ 201,6 мм ПЧ с ЛПО1 + 100 мм спереди = 351,6 мм*.</text><text x="1258" y="776" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#526879" text-anchor="start">Остаток до внешней глубины 400 мм — не гарантированный зазор.</text><text x="1258" y="810" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#526879" text-anchor="start">Профили, дверь, клеммы и радиусы кабелей проверяются по корпусу.</text><rect id="comparison" x="1240" y="895" width="1200" height="300" rx="10" fill="#EDF8F4" stroke="#277A69" stroke-width="1.6"/><text x="1258" y="941" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#18354A" text-anchor="start">Оценка основного корпуса и чувствительность</text><text x="1258" y="979" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#526879" text-anchor="start">1400 × 1000 × 400 мм*: показанный базовый эскиз.</text><text x="1258" y="1013" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#526879" text-anchor="start">Резерв размещения 960 / 3680 ≈ 26% полезных длин реек.</text><text x="1258" y="1047" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#526879" text-anchor="start">1200 × 1000 × 400 мм*: при удалении резервного ряда</text><text x="1258" y="1081" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#526879" text-anchor="start">останется 340 / 3060 ≈ 11%; это вариант с малым запасом.</text><text x="1258" y="1115" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#526879" text-anchor="start">Если занятые зоны увеличатся на 300 мм: резерв ≈18%.</text><text x="1258" y="1149" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#526879" text-anchor="start">При увеличении на 600 мм: ≈10%; пересмотреть корпус / состав.</text><rect id="rail-not-din" x="1240" y="1235" width="1200" height="230" rx="10" fill="#EDF5FB" stroke="#286A9B" stroke-width="1.6"/><text x="1258" y="1281" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#18354A" text-anchor="start">Резерв шкафа ≠ свободные каналы контроллера</text><text x="1258" y="1319" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#526879" text-anchor="start">WB и шесть модулей: 22 DIN; MAP3 + Новатек: ещё 4 DIN.</text><text x="1258" y="1353" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#526879" text-anchor="start">Подтверждённая модульная часть — 26 DIN, а не весь щит.</text><text x="1258" y="1387" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#526879" text-anchor="start">ПЧ крепится на плите; остальные сборки имеют неизвестные габариты.</text><text x="1258" y="1421" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#526879" text-anchor="start">Функциональный запас прежний: DI 0; DO 3; AO 3.</text><rect id="checks" x="1240" y="1505" width="1200" height="365" rx="10" fill="#FFF7E9" stroke="#A76B20" stroke-width="1.6"/><text x="1258" y="1551" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#18354A" text-anchor="start">До выбора корпуса и изготовления</text><text x="1258" y="1589" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#526879" text-anchor="start">Сверить габариты БП, контакторов, TUF, реле с колодками и клемм.</text><text x="1258" y="1623" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#526879" text-anchor="start">Завершить силовую схему, аппаратные защиты и решение D-321.</text><text x="1258" y="1657" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#526879" text-anchor="start">Проверить глубину и полезную плиту по реальному корпусу.</text><text x="1258" y="1691" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#526879" text-anchor="start">Выполнить тепловой расчёт с потерями всех устройств.</text><text x="1258" y="1725" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#526879" text-anchor="start">Определить кабели: заполнение коробов, вводы, ЭМС, экраны и PE.</text><text x="1258" y="1759" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#526879" text-anchor="start">Разнести цепи ИБП и сети; обеспечить отключение всех источников.</text><text x="1258" y="1793" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#526879" text-anchor="start">Подтвердить ИБП, автономность, АКБ, вентиляцию и прочность полки.</text><text x="1258" y="1827" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#526879" text-anchor="start">При любом превышении условной зоны пересчитать запас.</text><text x="60" y="1987" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#526879" text-anchor="start">Основание: D-305–D-311, D-322–D-334; карта I/O и интерфейс проекта. Источники и проверки — README.md.</text><text x="60" y="2014" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#526879" text-anchor="start">Названия блоков и линии — функциональные обозначения. Клеммы, адреса, номиналы и монтажные каналы не назначены.</text></svg>
