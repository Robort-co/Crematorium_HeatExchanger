<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1560" viewBox="0 0 1800 1560" role="img" aria-labelledby="title desc"><title id="title">Схема теплообменника — Общая структура</title><desc id="desc">Предварительная функциональная схема на WB8.5. Не монтажная электросхема. Состав согласован 15.11.2026; электрическое согласование — рабочее допущение. Проверки перечислены в README.md.</desc><defs><marker id="arrow0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M 0 0 L 10 5 L 0 10 z" fill="#286A9B"/></marker><marker id="arrow1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M 0 0 L 10 5 L 0 10 z" fill="#277A69"/></marker><marker id="arrow2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M 0 0 L 10 5 L 0 10 z" fill="#A76B20"/></marker><marker id="arrow3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M 0 0 L 10 5 L 0 10 z" fill="#18354A"/></marker></defs><rect width="100%" height="100%" fill="white"/><rect id="structure-banner" x="60" y="162" width="1680" height="46" rx="6" fill="#FFF7E9" stroke="none" stroke-width="1.6"/><polyline id="aranga-link" points="480,335 560,335 560,595 650,595" fill="none" stroke="#286A9B" stroke-width="2.5" stroke-linejoin="round" marker-start="url(#arrow0)" marker-end="url(#arrow0)"/><polyline id="hmi-link" points="900,385 900,550" fill="none" stroke="#286A9B" stroke-width="2.5" stroke-linejoin="round" marker-start="url(#arrow0)" marker-end="url(#arrow0)"/><polyline id="optional-link" points="1320,335 1240,335 1240,595 1150,595" fill="none" stroke="#A76B20" stroke-width="2.5" stroke-linejoin="round" stroke-dasharray="8 6" marker-start="url(#arrow2)" marker-end="url(#arrow2)"/><polyline id="boiler-link" points="450,650 650,650" fill="none" stroke="#A76B20" stroke-width="2.5" stroke-linejoin="round" stroke-dasharray="8 6" marker-start="url(#arrow2)" marker-end="url(#arrow2)"/><polyline id="port1" points="700,730 700,790 240,790 240,930" fill="none" stroke="#286A9B" stroke-width="2.5" stroke-linejoin="round" marker-start="url(#arrow0)" marker-end="url(#arrow0)"/><polyline id="port2" points="820,730 820,830 680,830 680,930" fill="none" stroke="#286A9B" stroke-width="2.5" stroke-linejoin="round" marker-start="url(#arrow0)" marker-end="url(#arrow0)"/><polyline id="extension" points="980,730 980,800 1120,800 1120,930" fill="none" stroke="#286A9B" stroke-width="2.5" stroke-linejoin="round" marker-start="url(#arrow0)" marker-end="url(#arrow0)"/><polyline id="wbio" points="1100,730 1100,770 1560,770 1560,930" fill="none" stroke="#286A9B" stroke-width="2.5" stroke-linejoin="round" marker-start="url(#arrow0)" marker-end="url(#arrow0)"/><polyline id="vfd-serial" points="1120,1015 1120,1085" fill="none" stroke="#286A9B" stroke-width="2.5" stroke-linejoin="round" marker-start="url(#arrow0)" marker-end="url(#arrow0)"/><polyline id="vfd-enable" points="1560,1180 1560,1245 1210,1245 1210,1200" fill="none" stroke="#277A69" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow1)"/><polyline id="motor" points="1030,1200 1030,1320" fill="none" stroke="#18354A" stroke-width="3.5" stroke-linejoin="round" marker-end="url(#arrow3)"/><polyline id="structure-rule" points="60,1480 1740,1480" fill="none" stroke="#CCD8E0" stroke-width="1" stroke-linejoin="round"/><text x="60" y="44" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#286A9B" text-anchor="start">ТЕПЛООБМЕННИК  /  АВТОМАТИЗАЦИЯ</text><text x="60" y="103" font-family="Arial, sans-serif" font-size="38" font-weight="700" fill="#18354A" text-anchor="start">Общая структура</text><text x="60" y="136" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#526879" text-anchor="start">Контроллер, предварительный комплект модулей, межсистемный обмен и границы питания</text><text x="78" y="192" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#A76B20" text-anchor="start">ПРЕДВАРИТЕЛЬНАЯ ФУНКЦИОНАЛЬНАЯ СХЕМА  •  НЕ ДЛЯ МОНТАЖА  •  15.11.2026  •  Лист 1/7</text><rect id="aranga" x="60" y="255" width="420" height="160" rx="10" fill="#EDF5FB" stroke="#286A9B" stroke-width="1.6"/><text x="78" y="297" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#18354A" text-anchor="start">ARANGA · ПЛК210</text><text x="78" y="331" font-family="Arial, sans-serif" font-size="19" font-weight="400" fill="#526879" text-anchor="start">Клиент Modbus TCP; ПИД тяги</text><text x="78" y="356" font-family="Arial, sans-serif" font-size="19" font-weight="400" fill="#526879" text-anchor="start">→ Пуск, Стоп, задание частоты</text><text x="78" y="381" font-family="Arial, sans-serif" font-size="19" font-weight="400" fill="#526879" text-anchor="start">← Состояния, готовность, измерения</text><text x="78" y="406" font-family="Arial, sans-serif" font-size="19" font-weight="400" fill="#526879" text-anchor="start">Эжектор управляется только ARANGA</text><rect id="hmi" x="690" y="255" width="420" height="130" rx="10" fill="#EDF5FB" stroke="#286A9B" stroke-width="1.6"/><text x="708" y="297" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#18354A" text-anchor="start">Веб-HMI</text><text x="708" y="332" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#526879" text-anchor="start">Команды, подтверждения, данные</text><text x="708" y="360" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#526879" text-anchor="start">Местное устройство не выбрано</text><rect id="optional-hmi" x="1320" y="255" width="420" height="160" rx="10" fill="#FFF7E9" stroke="#A76B20" stroke-width="1.6" stroke-dasharray="8 6"/><text x="1338" y="297" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#18354A" text-anchor="start">Аппаратная HMI · опция</text><text x="1338" y="331" font-family="Arial, sans-serif" font-size="19" font-weight="400" fill="#526879" text-anchor="start">Modbus TCP; отдельный проект</text><text x="1338" y="358" font-family="Arial, sans-serif" font-size="19" font-weight="400" fill="#526879" text-anchor="start">СП315 возможна, модель не выбрана</text><text x="1338" y="385" font-family="Arial, sans-serif" font-size="19" font-weight="400" fill="#526879" text-anchor="start">Проверить при проектировании шкафа</text><rect id="wb" x="650" y="550" width="500" height="180" rx="10" fill="#18354A" stroke="#18354A" stroke-width="1.6"/><text x="668" y="598" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#FFFFFF" text-anchor="start">Wiren Board 8.5</text><text x="668" y="633" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#E5EEF4" text-anchor="start">4 Гбайт RAM / 64 Гбайт eMMC; без модема</text><text x="668" y="661" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#E5EEF4" text-anchor="start">Основная программа → запросы</text><text x="668" y="689" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#E5EEF4" text-anchor="start">Защитная служба → итоговые команды</text><text x="668" y="717" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#E5EEF4" text-anchor="start">Отдельный программный надзор</text><rect id="boiler" x="60" y="550" width="390" height="180" rx="10" fill="#FFF7E9" stroke="#A76B20" stroke-width="1.6" stroke-dasharray="8 6"/><text x="78" y="592" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#18354A" text-anchor="start">АСУ котельной</text><text x="78" y="625" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#526879" text-anchor="start">← Запросы теплоотвода / циркуляции</text><text x="78" y="651" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#526879" text-anchor="start">→ Предусмотренное давление</text><text x="78" y="677" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#526879" text-anchor="start">Функциональный обмен Modbus</text><text x="78" y="703" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#526879" text-anchor="start">Транспорт и реализацию проверить</text><rect id="scope" x="1320" y="550" width="420" height="180" rx="10" fill="#FFF1EF" stroke="#A44643" stroke-width="1.6"/><text x="1338" y="592" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#A44643" text-anchor="start">Граница достоверности</text><text x="1338" y="626" font-family="Arial, sans-serif" font-size="19" font-weight="400" fill="#526879" text-anchor="start">WB и модули — общая зависимость.</text><text x="1338" y="653" font-family="Arial, sans-serif" font-size="19" font-weight="400" fill="#526879" text-anchor="start">Программная защита не заменяет</text><text x="1338" y="680" font-family="Arial, sans-serif" font-size="19" font-weight="400" fill="#526879" text-anchor="start">аппаратное обеспечение отказа WB.</text><text x="1338" y="707" font-family="Arial, sans-serif" font-size="19" font-weight="400" fill="#526879" text-anchor="start">Состояния выходов при отказах открыты.</text><rect x="480" y="451" width="170" height="48" fill="#FFFFFF"/><text x="565" y="470" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#286A9B" text-anchor="middle">Ethernet</text><text x="565" y="492" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#286A9B" text-anchor="middle">Modbus TCP</text><rect x="740" y="453" width="320" height="48" fill="#FFFFFF"/><text x="900" y="472" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#286A9B" text-anchor="middle">Ethernet</text><text x="900" y="494" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#286A9B" text-anchor="middle">Команды / данные</text><rect x="1150" y="451" width="180" height="48" fill="#FFFFFF"/><text x="1240" y="470" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#A76B20" text-anchor="middle">Ethernet</text><text x="1240" y="492" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#A76B20" text-anchor="middle">Modbus TCP</text><rect x="455" y="663" width="190" height="44" fill="#FFFFFF"/><text x="550" y="680" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="#A76B20" text-anchor="middle">Логическая связь</text><text x="550" y="700" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="#A76B20" text-anchor="middle">Маршрут проверить</text><rect id="analog" x="60" y="930" width="360" height="250" rx="10" fill="#EDF8F4" stroke="#277A69" stroke-width="1.6"/><text x="78" y="972" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#18354A" text-anchor="start">Аналоговые модули</text><text x="78" y="1007" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#526879" text-anchor="start">2 × WB-MAI6</text><text x="78" y="1038" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#526879" text-anchor="start">№1: 4 PT1000 + термопара K</text><text x="78" y="1069" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#526879" text-anchor="start">№2: 2 давления + ОС ШОД</text><text x="78" y="1100" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#526879" text-anchor="start">1 × WB-MAO4</text><text x="78" y="1131" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#526879" text-anchor="start">Команда ШОД: 1 AO из 4</text><rect id="meters" x="500" y="930" width="360" height="250" rx="10" fill="#EDF8F4" stroke="#277A69" stroke-width="1.6"/><text x="518" y="972" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#18354A" text-anchor="start">Измерительные приборы</text><text x="518" y="1006" font-family="Arial, sans-serif" font-size="19" font-weight="400" fill="#526879" text-anchor="start">TUF-2000B</text><text x="518" y="1037" font-family="Arial, sans-serif" font-size="19" font-weight="400" fill="#526879" text-anchor="start">Расход + резервная температура</text><text x="518" y="1068" font-family="Arial, sans-serif" font-size="19" font-weight="400" fill="#526879" text-anchor="start">WB-MAP3EV</text><text x="518" y="1099" font-family="Arial, sans-serif" font-size="19" font-weight="400" fill="#526879" text-anchor="start">Контроль силовой шины</text><text x="518" y="1130" font-family="Arial, sans-serif" font-size="19" font-weight="400" fill="#526879" text-anchor="start">Параметры общей линии проверить</text><rect id="ext" x="940" y="930" width="360" height="85" rx="10" fill="#EDF5FB" stroke="#286A9B" stroke-width="1.6"/><text x="958" y="970" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#18354A" text-anchor="start">WBE2-I-RS485-ISO</text><text x="958" y="1002" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#526879" text-anchor="start">Дополнительный изолированный порт</text><rect id="vfd" x="940" y="1085" width="360" height="115" rx="10" fill="#EDF5FB" stroke="#286A9B" stroke-width="1.6"/><text x="958" y="1126" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#18354A" text-anchor="start">ПЧВ103-4К0-В</text><text x="958" y="1160" font-family="Arial, sans-serif" font-size="19" font-weight="400" fill="#526879" text-anchor="start">→ Пуск / Стоп, частота</text><text x="958" y="1186" font-family="Arial, sans-serif" font-size="19" font-weight="400" fill="#526879" text-anchor="start">← Работа, частота, диагностика</text><rect id="digital" x="1380" y="930" width="360" height="250" rx="10" fill="#EDF8F4" stroke="#277A69" stroke-width="1.6"/><text x="1398" y="972" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#18354A" text-anchor="start">Дискретные модули</text><text x="1398" y="1006" font-family="Arial, sans-serif" font-size="19" font-weight="400" fill="#526879" text-anchor="start">1 × WBIO-DI-WD-14</text><text x="1398" y="1037" font-family="Arial, sans-serif" font-size="19" font-weight="400" fill="#526879" text-anchor="start">14 DI • свободных входов 0</text><text x="1398" y="1068" font-family="Arial, sans-serif" font-size="19" font-weight="400" fill="#526879" text-anchor="start">2 × WBIO-DO-R10A-8</text><text x="1398" y="1099" font-family="Arial, sans-serif" font-size="19" font-weight="400" fill="#526879" text-anchor="start">13 DO из 16 • свободны 3</text><text x="1398" y="1130" font-family="Arial, sans-serif" font-size="19" font-weight="400" fill="#526879" text-anchor="start">Реле и межблокировки сохранены</text><rect x="80" y="837" width="320" height="48" fill="#FFFFFF"/><text x="240" y="856" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#286A9B" text-anchor="middle">Встроенная RS-485 №1</text><text x="240" y="878" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#286A9B" text-anchor="middle">Modbus • запросы / данные</text><rect x="505" y="859" width="350" height="48" fill="#FFFFFF"/><text x="680" y="878" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#286A9B" text-anchor="middle">Встроенная RS-485 №2</text><text x="680" y="900" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#286A9B" text-anchor="middle">Modbus • запросы / данные</text><rect x="960" y="853" width="320" height="26" fill="#FFFFFF"/><text x="1120" y="872" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#286A9B" text-anchor="middle">Расширение контроллера</text><rect x="1390" y="838" width="340" height="48" fill="#FFFFFF"/><text x="1560" y="857" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#286A9B" text-anchor="middle">Боковая шина WBIO</text><text x="1560" y="879" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#286A9B" text-anchor="middle">DI → WB; WB → DO</text><rect x="960" y="1032" width="320" height="26" fill="#FFFFFF"/><text x="1120" y="1051" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#286A9B" text-anchor="middle">RS-485 / Modbus RTU</text><rect x="1270" y="1198" width="390" height="44" fill="#FFFFFF"/><text x="1465" y="1216" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#277A69" text-anchor="middle">DO → проводное разрешение ПЧ</text><text x="1465" y="1236" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#277A69" text-anchor="middle">Через предусмотренное реле</text><rect id="fan" x="940" y="1320" width="360" height="90" rx="10" fill="#FFFFFF" stroke="#18354A" stroke-width="1.6"/><text x="958" y="1362" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#18354A" text-anchor="start">Дымосос Д3,5</text><text x="958" y="1396" font-family="Arial, sans-serif" font-size="19" font-weight="400" fill="#526879" text-anchor="start">Двигатель АИР • привод от ПЧ</text><rect x="960" y="1268" width="280" height="26" fill="#FFFFFF"/><text x="1100" y="1287" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#18354A" text-anchor="middle">Силовое управление</text><rect id="power" x="60" y="1235" width="800" height="175" rx="10" fill="#F5F8FA" stroke="#CCD8E0" stroke-width="1.6"/><text x="78" y="1277" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#18354A" text-anchor="start">Границы питания · D-146</text><text x="78" y="1311" font-family="Arial, sans-serif" font-size="19" font-weight="400" fill="#526879" text-anchor="start">ИБП шкафа → АСУ / измерения и привод ШТ.</text><text x="78" y="1339" font-family="Arial, sans-serif" font-size="19" font-weight="400" fill="#526879" text-anchor="start">ИБП шкафа → подходящий DC-источник → WB.</text><text x="78" y="1367" font-family="Arial, sans-serif" font-size="19" font-weight="400" fill="#526879" text-anchor="start">Сеть / ДГУ → силовые коммутируемые потребители.</text><text x="78" y="1395" font-family="Arial, sans-serif" font-size="19" font-weight="400" fill="#526879" text-anchor="start">Новатек и MAP3EV измеряют силовую шину после выбора сети / ДГУ.</text><rect id="manual-bypass" x="1380" y="1320" width="360" height="110" rx="10" fill="#FFF7E9" stroke="#A76B20" stroke-width="1.6"/><text x="1398" y="1360" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#A76B20" text-anchor="start">ШБ · ручной</text><text x="1398" y="1392" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#526879" text-anchor="start">Подтверждение оператором в HMI</text><text x="1398" y="1418" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#526879" text-anchor="start">Датчик положения не предусмотрен</text><text x="60" y="1458" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#526879" text-anchor="start">Стрелка → направление действия / данных; ↔ запросы и ответы. Пунктир — опция или неуточнённое подключение.</text><text x="60" y="1512" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#526879" text-anchor="start">Основание: D-305–D-311, D-322–D-334; карта I/O и интерфейс проекта. Источники и проверки — README.md.</text><text x="60" y="1539" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#526879" text-anchor="start">Названия блоков и линии — функциональные обозначения. Клеммы, адреса, номиналы и монтажные каналы не назначены.</text></svg>
